<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" preserveAspectRatio="none" class="a-pico" aria-hidden="true" focusable="false">
  <!-- La montaña de Yamanouchi, acto 6. Kiko, viendo el acto publicado:
       «a la derecha una especie de montaña que se vea como en la mitad, es
       decir, que empiece en la base y el pico se corte justo en el lateral
       derecho».

       🚨 ESTO NO ES arte/monte.svg, Y NO PUEDE SERLO. El monte del acto 4 es un
       MONTON DE NIEVE: una cupula ancha y baja, redibujada tres veces hasta
       quitarle el pico a proposito —campana puntiaguda, mesa, cupula— porque lo
       que tenia que parecer era nieve amontonada. Esto es lo contrario: una
       montania de verdad, con pico. Dos dibujos distintos porque cuentan dos
       cosas distintas.

       🚨 EL PICO ESTA EN EL BORDE DERECHO DEL viewBox, y esa es toda la gracia:
       la pieza se coloca con su borde derecho en el borde derecho de la
       pantalla, y el pico queda cortado justo ahi. La ladera baja hacia la
       izquierda a lo largo de toda la caja, asi que lo que se ve es media
       montania — que es lo que pidio.
       📐 En una pantalla ancha se vera un poco de cielo a la derecha del pico:
       la unidad es `vmin` y un portatil mide 160 unidades de ancho en vez de
       100. Se compone para el movil, que es la prioridad (NORMAS § 1).

       🚨 Y VA POR DETRAS DE TODO lo demas del acto: es el fondo del fondo, mas
       lejos incluso que el bosque. Por eso el trazo es mas fino y el relleno
       mas palido que el de las piezas de delante: en esta pelicula no hay
       sombras ni degradados (NORMAS § 1), asi que la profundidad se hace con el
       peso del trazo y nada mas.

       📄 Y una convencion de escritura: en los comentarios de un `.svg` las
       variables de CSS se nombran entrecomilladas y sin sus dos guiones. Dos
       guiones seguidos dentro de un comentario son XML invalido, y estos
       archivos existen para poder abrirlos en un editor vectorial. -->

  <!-- La ladera. Sube de la base izquierda hasta el pico, que cae justo en el
       borde derecho de la caja. Los dos quiebros de la subida son lo que la
       separa de un triangulo: una montania real no sube recta. -->
  <path class="p-roca" d="M0 220
    L58 196 L92 170 L120 156 L152 118 L186 96 L214 60 L246 38 L272 14 L300 0
    L300 220 Z"/>

  <!-- La nieve de la cumbre: la misma cresta, cortada a media altura. Va
       encima de la roca y se apoya en sus mismos quiebros, asi que si se
       retoca la ladera se retoca esta linea. -->
  <path class="p-nieve" d="M152 118 L186 96 L214 60 L246 38 L272 14 L300 0
    L300 92 L272 74 L246 86 L214 78 L186 104 L166 118 Z"/>

  <!-- Dos vaguadas, que es lo unico que dice que es roca y no un carton
       recortado. Lineas de pelo, como las costas del mapa. -->
  <path class="p-veta" d="M92 170 L128 132 L152 118"/>
  <path class="p-veta" d="M186 96 L208 120 L232 104"/>
</svg>
