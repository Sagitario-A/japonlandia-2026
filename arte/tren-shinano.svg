<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 1500" preserveAspectRatio="none" class="a-tren7" aria-hidden="true" focusable="false">
  <!-- EL LIMITED EXPRESS SHINANO (しなの), VISTO DESDE ARRIBA · acto 7.
       Matsumoto → Nagoya, ~2 h ✅ — investigacion/021 § 3.

       🚨 EL MORRO VA ABAJO, Y ESO NO ES UN DETALLE: ES EL SENTIDO DEL VIAJE.
       Kiko, el 20 de septiembre, viendo el acto publicado: *«[el tren] va para
       arriba, pero tendría que continuar para abajo, porque al final es un
       viaje unidireccional en una dirección»*. Y tiene razón hasta en el mapa:
       Matsumoto está al norte y Kioto al sur, así que el viaje BAJA por la
       pantalla igual que baja por el mapa. Un morro apuntando al norte con el
       mundo corriendo hacia arriba es un tren marcha atrás.

       🚨 ESTE DIBUJO Y EL DEL SHINKANSEN SON EL MISMO CUERPO, Y SOLO CAMBIA EL
       MORRO. Lo decidió Kiko el 18 de septiembre, viendo el problema: el guion
       decía «se pone en paralelo con un tren igual» y no son iguales —uno es un
       limited express y el otro un shinkansen—, así que eligió el camino de en
       medio: *mismo tamaño, morro distinto*. Las dos barras miden lo mismo y
       las divisiones de coche caen en los mismos sitios, de manera que en el
       transbordo siguen leyéndose como un espejo; lo único que cambia es la
       punta.

       🚨 Y ESO SIGNIFICA QUE LA GEOMETRÍA DEL CUERPO ESTÁ ESCRITA DOS VECES,
       aquí y en tren-shinkansen.svg. Es el mismo caso que bosque.svg y
       bosque-nevado.svg, que tienen los árboles en las mismas coordenadas
       exactas: **no se puede tocar uno sin tocar el otro**. Las divisiones van
       en 196, 426, 656, 886 y 1116 en los dos.

       🚨 EL MORRO TIENE QUE VERSE, y por eso el tren no acaba en el borde de
       abajo de la pantalla: el acto lo planta con la punta un poco por encima
       del canto y el cuerpo se va por arriba. «Como una barra de arriba abajo»
       se sigue leyendo igual, y a cambio en el transbordo se pueden comparar
       los dos morros, que es justo la comparación que Kiko eligió hacer.

       ⚠️ LOS COLORES NO SON LA LIBREA DE VERDAD. El 383 series lleva blanco con
       una banda, pero los colores de línea de este viaje están sin verificar
       (PENDIENTE W4) y en esta web el color de una línea es un dato. Esto es
       caricatura, con la misma paleta de tren que el cercanías del acto 3.

       📐 Proporción: 120 × 1500, y la pieza mide 24u × 300u. Los dos ejes van a
       la misma escala. preserveAspectRatio="none" por lo mismo que las montañas
       del acto 6 (fila 68 del inventario): la caja manda. -->

  <!-- 🚨 EL MORRO, QUE ES LO ÚNICO DISTINTO: CORTO Y REDONDEADO, Y ABAJO.
       Un limited express convencional tiene la cabina justo delante del primer
       coche, así que desde arriba la punta es un hocico ancho que se resuelve
       en muy poca longitud. Comparado con el del shinkansen, que llega hasta
       y=1475 estrechándose, este se planta en y=1448 de golpe. -->
  <path class="v7-cuerpo" d="M6 0 V1310 C6 1390 26 1448 60 1448 C94 1448 114 1390 114 1310 V0 Z"/>

  <!-- El parabrisas de la cabina: desde arriba es lo que dice «por aquí va
       delante». Sin él, la punta es una barra redondeada y nada más. -->
  <path class="v7-cristal" d="M20 1350 C24 1404 38 1428 60 1428 C82 1428 96 1404 100 1350 Z"/>

  <!-- Las dos bandas del costado. Desde arriba de un tren se ve el techo y un
       filo de los costados: estas dos franjas son ese filo. -->
  <rect class="v7-banda" x="6" y="0" width="9" height="1310"/>
  <rect class="v7-banda" x="105" y="0" width="9" height="1310"/>

  <!-- El lomo del techo, la línea que recorre el tren de punta a punta -->
  <rect class="v7-lomo" x="58" y="0" width="4" height="1380"/>

  <!-- Las divisiones entre coches. 🚨 EN LOS MISMOS SITIOS QUE EL SHINKANSEN -->
  <g class="v7-junta">
    <rect x="6" y="196" width="108" height="8"/>
    <rect x="6" y="426" width="108" height="8"/>
    <rect x="6" y="656" width="108" height="8"/>
    <rect x="6" y="886" width="108" height="8"/>
    <rect x="6" y="1116" width="108" height="8"/>
  </g>

  <!-- Los equipos del techo: el aire acondicionado de cada coche. Son lo que
       hace que esto se lea como un techo de tren y no como una tabla. -->
  <g class="v7-equipo">
    <rect x="34" y="86" width="52" height="34" rx="6"/>
    <rect x="34" y="246" width="52" height="34" rx="6"/>
    <rect x="34" y="316" width="52" height="34" rx="6"/>
    <rect x="34" y="476" width="52" height="34" rx="6"/>
    <rect x="34" y="546" width="52" height="34" rx="6"/>
    <rect x="34" y="706" width="52" height="34" rx="6"/>
    <rect x="34" y="776" width="52" height="34" rx="6"/>
    <rect x="34" y="936" width="52" height="34" rx="6"/>
    <rect x="34" y="1006" width="52" height="34" rx="6"/>
    <rect x="34" y="1166" width="52" height="34" rx="6"/>
    <rect x="34" y="1236" width="52" height="34" rx="6"/>
  </g>

  <!-- 🚨 LOS PANTÓGRAFOS, que son la firma de un tren eléctrico visto desde
       arriba: el marco carenado y, cruzada, la pletina que roza el cable. Sin
       ellos, desde arriba, esto podría ser un autobús muy largo.
       🔁 Estaban dibujados como dos brazos en V y en pantalla parecían una
       FLECHA negra apuntando hacia delante: a 24u de ancho, un trazo de tres
       unidades pesa como una señal de tráfico. Se vio en la captura. -->
  <g class="v7-panto">
    <rect x="38" y="798" width="44" height="30" rx="3"/>
    <rect class="v7-pletina" x="32" y="814" width="56" height="6"/>
    <rect x="38" y="338" width="44" height="30" rx="3"/>
    <rect class="v7-pletina" x="32" y="354" width="56" height="6"/>
  </g>

  <!-- Las puertas, en los extremos de cada coche. Marcas cortas en el filo -->
  <g class="v7-puerta">
    <rect x="6" y="1050" width="9" height="40"/><rect x="105" y="1050" width="9" height="40"/>
    <rect x="6" y="900" width="9" height="40"/><rect x="105" y="900" width="9" height="40"/>
    <rect x="6" y="820" width="9" height="40"/><rect x="105" y="820" width="9" height="40"/>
    <rect x="6" y="670" width="9" height="40"/><rect x="105" y="670" width="9" height="40"/>
    <rect x="6" y="590" width="9" height="40"/><rect x="105" y="590" width="9" height="40"/>
    <rect x="6" y="440" width="9" height="40"/><rect x="105" y="440" width="9" height="40"/>
    <rect x="6" y="360" width="9" height="40"/><rect x="105" y="360" width="9" height="40"/>
    <rect x="6" y="210" width="9" height="40"/><rect x="105" y="210" width="9" height="40"/>
    <rect x="6" y="130" width="9" height="40"/><rect x="105" y="130" width="9" height="40"/>
  </g>
</svg>
