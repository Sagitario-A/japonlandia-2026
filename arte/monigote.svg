<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 150" class="a-monigote" aria-hidden="true" focusable="false">
  <!-- El monigote de toda la nieve. Kiko, el 18 de septiembre: «el muñeco, en
       vez de esquí, que haga snowboard».

       🚨 SE LLAMA `monigote` Y NO `esquiador`, y el cambio de nombre es a
       propósito: en el acto 5 se choca con una roca, se cae y acaba metido en
       un onsen, y en el 6 se asusta de un mono y sale corriendo. De tabla nada.
       Es el mismo muñeco toda la nieve, así que lleva el nombre con el que Kiko
       lo llama —«el muñequito», «el muñeco»— y no el del deporte que hace en un
       acto. Si mañana cambia de tabla a otra cosa, no hay que renombrar nada.

       🚨 SIN CARA Y SIN RASGOS, igual que los cuatro de arte/cuatro.svg: Kiko
       dijo «aún no van a tener estilo propio, ya se lo daremos después». Este es
       uno de ellos, con el rojo del primero. Cuando diga cómo son, se cambian
       los dos archivos y ninguno más.

       🚨 LA TABLA YA NO ESTÁ AQUÍ: se fue a arte/tabla.svg el 16 de septiembre,
       cuando Kiko describió el acto 5 —«se cae de la tabla y sube hacia arriba
       en diagonal»—. A partir del golpe cada uno va por su lado, y dos cosas
       que se mueven por separado no pueden ser el mismo dibujo. Las dos piezas
       comparten `viewBox` y tamaño, así que mientras van pegadas basta con
       darles la misma `x`, la misma `y` y el mismo giro.

       🚨 DOS POSTURAS EN EL MISMO ARCHIVO, y se cambia con la variable «pose»
       (0 la tabla, 1 el onsen). No es un fundido: el cambio pasa MIENTRAS ESTÁ
       DEBAJO DEL AGUA, que es la tapadera perfecta. Kiko: «el muñeco atraviesa
       el agua del onsen y ya sale en posición de estar apoyado así, tipo con
       los brazos como relajándose, que se le ve solamente el torso hacia arriba».
       Van las dos en el mismo archivo porque es el mismo personaje: partirlo en
       `monigote.svg` y `monigote-onsen.svg` sería tener la cabeza escrita dos
       veces en dos sitios, y el día que tenga cara habría que acordarse de las
       dos.

       🚨 SE APOYA EN EL BORDE DE ABAJO DE LA CAJA. La capa del dibujo ancla las
       piezas por su base. En la postura del onsen eso no importa: ahí el acto
       lo hunde a propósito con «y» y lo de abajo queda por debajo del agua.

       🚨 Y EL TRAZO ES FINO (1.6 y no el «grosor» de la paleta). Con
       non-scaling-stroke el trazo mide lo mismo en pantalla para todas las
       piezas, y esta es la más pequeña de las once: con 2,6 px parecía dibujada
       con rotulador gordo al lado del coche.

       📄 Y una convención de escritura, que parece una tontería y no lo es: en
       los comentarios de un `.svg` las variables de CSS se nombran ENTRECOMILLADAS
       y sin sus dos guiones. Dos guiones seguidos dentro de un comentario son
       XML inválido, y estos archivos existen para poder abrirlos en un editor
       vectorial (NORMAS § 9): un editor los rechaza aunque el navegador, que
       los recibe por `innerHTML`, se los trague sin rechistar. -->

  <!-- ══════ POSTURA 1 · EN TABLA ══════
       De lado, los dos pies en la tabla, las rodillas dobladas y los brazos
       abiertos haciendo equilibrio. Sin bastones. Actos 4 y el principio del 5. -->
  <g class="e-pose e-pose-tabla" data-postura="tabla">
    <!-- El brazo de atrás va DETRÁS del cuerpo -->
    <rect class="e-brazo e-brazo-atras" x="-6" y="-13" width="12" height="27" rx="6"
          transform="translate(40,74) rotate(46)"/>
    <!-- Las fijaciones: los dos pies van en la misma tabla -->
    <rect class="e-bota" x="36" y="124" width="21" height="14" rx="5"/>
    <rect class="e-bota" x="73" y="124" width="21" height="14" rx="5"/>
    <!-- Las piernas, dobladas y abiertas -->
    <rect class="e-pierna" x="-7.5" y="-17" width="15" height="35" rx="7.5"
          transform="translate(52,110) rotate(17)"/>
    <rect class="e-pierna" x="-7.5" y="-17" width="15" height="35" rx="7.5"
          transform="translate(79,110) rotate(-19)"/>
    <!-- El cuerpo, agachado y girado un pelo hacia la bajada -->
    <rect class="e-cuerpo" x="-15" y="-23" width="30" height="46" rx="14"
          transform="translate(65,80) rotate(7)"/>
    <!-- El brazo de delante, abierto haciendo equilibrio -->
    <rect class="e-brazo" x="-6" y="-14" width="12" height="29" rx="6"
          transform="translate(90,72) rotate(-52)"/>
    <!-- La cabeza y el gorro -->
    <circle class="e-cabeza" cx="69" cy="42" r="14"/>
    <path class="e-gorro" d="M55 40 a14 14 0 0 1 28 0 q-14 -5 -28 0 z"/>
    <circle class="e-pompon" cx="69" cy="25" r="5"/>
  </g>

  <!-- ══════ POSTURA 2 · RELAJADO EN EL ONSEN ══════
       «Apoyado así, tipo con los brazos como relajándose en el onsen.»
       De frente, recto y con los dos brazos abiertos sobre el borde. De cintura
       para abajo no hay nada dibujado: ahí está el agua, y el acto lo hunde
       hasta que la superficie le cruza por media espalda.
       🚨 EL CUERPO VA RECTO, sin el giro de 7° de la postura de tabla: ese giro
       es el de quien está bajando, y aquí no baja nadie. -->
  <g class="e-pose e-pose-onsen" data-postura="onsen">
    <!-- Los brazos, tendidos sobre el borde y con las manos por fuera -->
    <rect class="e-brazo" x="-6" y="-13" width="12" height="30" rx="6"
          transform="translate(45,84) rotate(74)"/>
    <rect class="e-brazo" x="-6" y="-13" width="12" height="30" rx="6"
          transform="translate(89,84) rotate(-74)"/>
    <!-- El torso, recto y un pelo echado hacia atrás -->
    <rect class="e-cuerpo" x="-15" y="-24" width="30" height="48" rx="14"
          transform="translate(67,96)"/>
    <!-- La cabeza, el gorro y el pompón, en el mismo sitio que en la otra
         postura para que el cambio bajo el agua no dé un salto -->
    <circle class="e-cabeza" cx="67" cy="52" r="14"/>
    <path class="e-gorro" d="M53 50 a14 14 0 0 1 28 0 q-14 -5 -28 0 z"/>
    <circle class="e-pompon" cx="67" cy="35" r="5"/>
  </g>

  <!-- ══════ POSTURA 3 · CORRIENDO ══════
       Acto 6: «el muñeco lo ve, se asusta, sale hacia la izquierda corriendo».

       🚨 CORRE HACIA LA IZQUIERDA, y por eso mira a la izquierda: es la unica
       postura de las tres que tiene lado. Las otras dos valen giradas porque
       una baja de izquierda a derecha y la otra esta de frente.

       Como se lee que corre y no que anda, en un dibujo quieto:
         · las dos piernas ABIERTAS en tijera, una adelante y otra atras,
         · los dos brazos tambien en tijera y al reves que las piernas,
         · el cuerpo ECHADO HACIA DELANTE (11 grados), que es lo que separa
           correr de estar de pie,
         · y LOS DOS PIES EN EL AIRE: el ancla de la pieza esta en la base de la
           caja, o sea en el suelo, asi que las botas no llegan abajo del todo.
           Un corredor con los dos pies plantados parece un maniqui.

       🚨 LA CABEZA VA UN PELO MAS BAJA que en las otras dos (cy=46 en vez de 42
       y 52) porque el cuerpo esta inclinado. Si se deja a la misma altura, al
       cambiar de postura el muneco pega un salto vertical, y el cambio aqui NO
       pasa debajo del agua: pasa a la vista, mientras se levanta del onsen. -->
  <g class="e-pose e-pose-corre" data-postura="corre">
    <!-- El brazo de atras, echado hacia atras y por detras del cuerpo -->
    <rect class="e-brazo e-brazo-atras" x="-6" y="-13" width="12" height="28" rx="6"
          transform="translate(88,78) rotate(38)"/>
    <!-- La pierna de atras, estirada hacia atras y con el pie levantado -->
    <rect class="e-pierna" x="-7.5" y="-17" width="15" height="34" rx="7.5"
          transform="translate(84,108) rotate(31)"/>
    <rect class="e-bota" x="92" y="124" width="21" height="13" rx="5"
          transform="rotate(24 102 130)"/>
    <!-- La pierna de delante, doblada y subida: la rodilla va alta -->
    <rect class="e-pierna" x="-7.5" y="-17" width="15" height="32" rx="7.5"
          transform="translate(52,104) rotate(-28)"/>
    <rect class="e-bota" x="30" y="115" width="21" height="13" rx="5"
          transform="rotate(-16 40 121)"/>
    <!-- El cuerpo, echado hacia delante -->
    <rect class="e-cuerpo" x="-15" y="-23" width="30" height="46" rx="14"
          transform="translate(68,82) rotate(-11)"/>
    <!-- El brazo de delante, cruzado hacia delante -->
    <rect class="e-brazo" x="-6" y="-14" width="12" height="29" rx="6"
          transform="translate(48,74) rotate(-34)"/>
    <!-- La cabeza y el gorro, mirando a la izquierda. El pompon se va hacia
         atras: es lo que da la sensacion de velocidad sin dibujar una sola
         linea de movimiento. -->
    <circle class="e-cabeza" cx="62" cy="46" r="14"/>
    <path class="e-gorro" d="M48 44 a14 14 0 0 1 28 0 q-14 -5 -28 0 z"
          transform="rotate(-11 62 44)"/>
    <circle class="e-pompon" cx="78" cy="33" r="5"/>
  </g>
</svg>
