<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" class="a-poza" aria-hidden="true" focusable="false">
  <!-- EL CHARCO DE LA CIMA · la mitad de DELANTE. Acto 6.
       Va POR DELANTE del mono y es la que lo tapa de la cintura para abajo: es
       lo que hace que se le vea metido en el agua y no de pie encima.

       🚨 SU PAREJA ES arte/poza-fondo.svg, y ahi esta la explicacion de por que
       esto dejo de ser un onsen con borde de piedras y paso a ser un charco.
       SI SE TOCA UNA, SE TOCA LA OTRA. Se parten por el eje del agua, y=104:
       aqui va todo lo que queda por debajo.

       El vaho va aqui, por delante de todo, igual que en el onsen del acto 5:
       son dos hilillos y es lo unico que dice que el agua esta caliente y no
       helada, que en una pantalla llena de nieve azul no se da por hecho. -->

  <!-- 🚨 LA ORILLA DE DELANTE, Y NO ES ADORNO: ES LO QUE TAPA AL MONO.
       Kiko, segunda ronda: «que el mono tenga medio torso fuera como el muñeco,
       no que se vea por encima de la montaña». Para eso hay que hundirlo, y al
       hundirlo la mitad de abajo se le sale por debajo de la linea del agua —el
       charco es plano y no llega a taparla—. Asi que el charco lleva por delante
       un reborde de nieve que sube hasta el eje del agua: es la orilla de la
       cima, y es lo que esconde lo que queda sumergido.
       Va lo PRIMERO de este archivo para quedar por detras del agua. -->
  <path class="z-orilla" d="M20 104 q0 46 130 46 q130 0 130 -46 q0 30 -130 30 q-130 0 -130 -30 z"/>

  <!-- El agua, mitad de delante -->
  <path class="o-agua" d="M42 104 A108 34 0 0 0 258 104 Z"/>

  <!-- Dos rizos, quietos: un agua animada en cada fotograma es la ley 15 -->
  <path class="o-riza" d="M88 116 q10 -5 20 0 q10 5 20 0"/>
  <path class="o-riza" d="M176 120 q10 -5 20 0 q10 5 20 0"/>

  <!-- El vaho, lo unico de todo el dibujo que va a media tinta: es vapor -->
  <path class="o-vaho" d="M112 92 q-8 -16 2 -28 q8 -10 2 -22"/>
  <path class="o-vaho" d="M196 96 q8 -14 -1 -26 q-8 -11 -1 -20"/>
</svg>
