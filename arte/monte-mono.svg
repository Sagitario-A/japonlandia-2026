<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" class="a-monte-mono" aria-hidden="true" focusable="false">
  <!-- LA MONTAÑA DE LOS MONOS · acto 6, primera ronda de correcciones.
       Kiko: «justo delante de esa montaña grande, yo te diria de hacer una
       pequeña, pero que este como traida al frente, de hecho puede estar delante
       de los arboles. Y que arriba tambien haya como un charquito de agua, o
       sea que sea la subida, y arriba como plano, y que haya agua como un onsen
       tambien, el mitico onsen donde se bañan estos monos, pero que el onsen sea
       la base de la cima de la montaña. Y que desde ahi salte el mono y baje por
       la ladera asustando al muñeco».

       🚨 ESTA MONTAÑA TIENE DOS TRABAJOS Y POR ESO NO ES arte/pico.svg.
       La grande del fondo es paisaje: esta lejos, es palida y no pasa nada
       encima de ella. Esta es un ESCENARIO: el mono se baña en su cima y baja
       corriendo por su ladera. O sea que su perfil no es decoracion, es el
       suelo por el que anda algo — y eso cambia como hay que dibujarla.

       🚨 LA CIMA ES PLANA A PROPOSITO, y lo pidio el: «arriba como plano, y que
       haya agua». Ahi se apoya la poza. Una cima en pico no tendria donde
       ponerla, y ademas los onsen de monos de verdad estan en repechos llanos
       entre rocas, no en agujas.

       🚨 Y EL PERFIL SE MIDE DE ESTE DIBUJO, NO SE ESCRIBE OTRA VEZ EN EL
       JAVASCRIPT (ley 18). `.mm-perfil` es un trazado ABIERTO que recorre el
       borde de arriba de izquierda a derecha, y `motor/dibujo.js` lo muestrea
       con getPointAtLength al cargarlo para saber a que altura esta la ladera
       en cada punto. Es lo mismo que hace la montaña del acto 4 con el
       monigote: retocar esta curva mueve al mono con ella, sin tocar codigo.
       🚨 Si se cambia el `viewBox`, se cambia la tabla de tamaños del CSS.

       📄 En los comentarios de un `.svg` las variables de CSS se nombran
       entrecomilladas y sin sus dos guiones: dos guiones seguidos son XML
       invalido y estos archivos se abren en un editor vectorial. -->

  <!-- El cuerpo de la montaña. Es el mismo recorrido que `.mm-perfil`, cerrado
       por abajo para poder rellenarlo. 🚨 Si se toca uno, se toca el otro. -->
  <path class="mm-roca" d="M0 260
    L34 236 L72 208 L104 176 L134 140 L162 110 L192 92
    L300 92
    L330 114 L352 150 L370 190 L386 224 L400 260 Z"/>

  <!-- 🚨 EL PERFIL, ABIERTO Y SOLO EL BORDE DE ARRIBA. De aqui sale la tabla de
       alturas por la que baja el mono. Va de izquierda a derecha y NO se cierra:
       cerrarlo metería la base en el muestreo y el mono bajaría por el suelo. -->
  <path class="mm-perfil" fill="none" stroke="none" d="M0 260
    L34 236 L72 208 L104 176 L134 140 L162 110 L192 92
    L300 92
    L330 114 L352 150 L370 190 L386 224 L400 260"/>

  <!-- El manto de nieve de la cima y de la ladera de arriba, que es lo que la
       ata con el resto de la pelicula: lleva nevando cuatro actos -->
  <path class="mm-nieve" d="M134 140 L162 110 L192 92 L300 92 L330 114 L352 150
    q-30 14 -60 6 q-40 -10 -78 -4 q-34 6 -50 -8 z"/>

  <!-- El repecho llano de la cima, donde se apoya la poza -->
  <rect class="mm-repecho" x="188" y="88" width="116" height="8" rx="4"/>

  <!-- Dos vetas en la roca, que es lo unico que dice que es piedra y no un
       carton recortado. Lineas de pelo, como las costas del mapa. -->
  <path class="mm-veta" d="M72 208 L112 186 L138 196"/>
  <path class="mm-veta" d="M330 114 L342 152 L366 160"/>
</svg>
