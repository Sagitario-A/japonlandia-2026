<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" class="a-matsumoto" aria-hidden="true" focusable="false">
  <!-- 松本城 · EL 大天守 DE MATSUMOTO. Final del acto 6.
       🔁 SEGUNDA VERSION. La primera dibujaba los CINCO edificios del conjunto
       —la torre principal, el 乾小天守, el 渡櫓 y los dos torreones del este— y
       Kiko la corrigio: «haz solamente la torre principal, y hazla mas detallada
       y mas grande, que tenga mas presencia… y solo la plena torre y con mas
       nivel de detalle, no tan minimalista como hemos acostumbrado a hacer los
       dibujos».

       🚨 Y TIENE RAZON POR UN MOTIVO QUE NO ES DE GUSTO: a 52 unidades de ancho,
       cinco edificios son cinco manchas pequeñas y ninguna se lee. Una sola
       torre al mismo ancho es el triple de alta, y entonces si se reconoce. En
       una pelicula que se ve en un movil, el detalle no se consigue dibujando
       mas cosas: se consigue dibujando MENOS cosas mas grandes.

       ✅ LOS DATOS, verificados el 17 de septiembre de 2026 en la Wikipedia
       japonesa de 松本城 y en la ficha del Ayuntamiento de Matsumoto:
         · 国宝 (Tesoro Nacional) desde 1936, reconfirmado en 1952.
         · 層塔型 5重6階: CINCO tejados por fuera y seis plantas por dentro. Es
           el tenshu de madera mas antiguo que se conserva de esa clase.
         · 🚨 LOS COLORES SON UN DATO: los DOS TERCIOS DE ABAJO de cada cuerpo
           van en 下見板張 —tabla lacada NEGRA— y el tercio de arriba en 白漆喰,
           estuco blanco. Por eso lo llaman 烏城, el castillo cuervo.
         · Los 破風 (frontones) van en blanco, y en la fachada hay de dos clases:
           三角 (千鳥破風) y el CURVO (唐破風), que es el mismo tipo de fronton que
           el hotel de Yamanouchi. Los dos estan dibujados aqui.
         · En el caballete, dos 鯱 (shachi), los peces-dragon dorados.

       🚨 QUE ES «MAS DETALLE» EN ESTA PELICULA, Y QUE NO.
       NORMAS § 1 prohibe degradados, sombras y texturas, y eso NO se ha tocado:
       aqui sigue todo en manchas planas y trazo. Lo que sube es la CANTIDAD de
       piezas dibujadas —las hiladas de tabla, las troneras, las mensulas bajo
       los aleros, las barandillas, la curva de los aleros en vez de rectas— que
       es detalle de dibujo, no de acabado. Es la unica pieza de la pelicula con
       este nivel, y es a proposito: es el remate del viaje.

       📄 En los comentarios de un `.svg` las variables de CSS se nombran
       entrecomilladas y sin sus dos guiones: dos guiones seguidos son XML
       invalido y estos archivos se abren en un editor vectorial. -->

  <!-- ══════════ EL 石垣 · el muro de silleria en talud ══════════ -->
  <path class="ma-piedra" d="M52 400 L308 400 L338 470 L22 470 Z"/>
  <g class="ma-junta">
    <path d="M40 436 H320 M30 458 H330"/>
    <path d="M96 400 L88 470 M160 400 L156 470 M200 400 L204 470 M264 400 L272 470"/>
  </g>
  <!-- La nieve encima del muro: lleva nevando cuatro actos -->
  <path class="ma-nieve" d="M52 400 q64 -14 128 0 q64 14 128 0 l6 12 q-64 12 -134 0 q-70 -12 -134 0 z"/>

  <!-- ══════════ CUERPO 5 · el mas ancho, el de abajo ══════════ -->
  <rect class="ma-blanco" x="60" y="336" width="240" height="26"/>
  <rect class="ma-negro" x="60" y="362" width="240" height="40"/>
  <!-- 🚨 LAS HILADAS DE TABLA (下見板張). Son lo que convierte una mancha negra
       en un muro de madera, y es el detalle que mas se nota a este tamaño. -->
  <g class="ma-tabla">
    <path d="M60 372 H300 M60 382 H300 M60 392 H300"/>
  </g>
  <!-- Ventanas enrejadas y troneras cuadradas -->
  <g class="ma-vano"><rect x="84" y="340" width="20" height="18"/><rect x="132" y="340" width="20" height="18"/><rect x="208" y="340" width="20" height="18"/><rect x="256" y="340" width="20" height="18"/></g>
  <g class="ma-reja"><path d="M94 340 v18 M84 349 h20 M142 340 v18 M132 349 h20 M218 340 v18 M208 349 h20 M266 340 v18 M256 349 h20"/></g>
  <g class="ma-tronera"><rect x="170" y="368" width="14" height="14"/><rect x="112" y="368" width="14" height="14"/><rect x="228" y="368" width="14" height="14"/></g>
  <!-- El alero, con su curva y sus mensulas -->
  <path class="ma-tejado" d="M38 336 Q54 314 180 306 Q306 314 322 336 L332 348 L28 348 Z"/>
  <g class="ma-mensula"><rect x="70" y="330" width="8" height="14"/><rect x="176" y="326" width="8" height="18"/><rect x="282" y="330" width="8" height="14"/></g>

  <!-- ══════════ CUERPO 4 ══════════ -->
  <rect class="ma-blanco" x="76" y="272" width="208" height="22"/>
  <rect class="ma-negro" x="76" y="294" width="208" height="30"/>
  <g class="ma-tabla"><path d="M76 304 H284 M76 314 H284"/></g>
  <g class="ma-vano"><rect x="100" y="276" width="18" height="16"/><rect x="146" y="276" width="18" height="16"/><rect x="196" y="276" width="18" height="16"/><rect x="242" y="276" width="18" height="16"/></g>
  <g class="ma-reja"><path d="M109 276 v16 M100 284 h18 M155 276 v16 M146 284 h18 M205 276 v16 M196 284 h18 M251 276 v16 M242 284 h18"/></g>
  <!-- 🚨 EL 唐破風, el fronton CURVO de la fachada. Es la misma figura que hace
       reconocible el hotel de Yamanouchi, y tambien aqui hay que dibujarla con
       el centro ALTO: sube por los lados, baja, y vuelve a levantarse. -->
  <path class="ma-hafu" d="M126 294 q22 -34 46 -36 q10 -1 8 -12 q-2 11 8 12 q24 2 46 36 z"/>
  <path class="ma-tejado" d="M58 272 Q74 252 180 246 Q286 252 302 272 L312 284 L48 284 Z"/>
  <g class="ma-mensula"><rect x="88" y="266" width="7" height="14"/><rect x="176" y="262" width="8" height="18"/><rect x="265" y="266" width="7" height="14"/></g>

  <!-- ══════════ CUERPO 3 ══════════ -->
  <rect class="ma-blanco" x="92" y="214" width="176" height="20"/>
  <rect class="ma-negro" x="92" y="234" width="176" height="24"/>
  <g class="ma-tabla"><path d="M92 243 H268 M92 251 H268"/></g>
  <g class="ma-vano"><rect x="116" y="218" width="16" height="14"/><rect x="172" y="218" width="16" height="14"/><rect x="228" y="218" width="16" height="14"/></g>
  <g class="ma-reja"><path d="M124 218 v14 M116 225 h16 M180 218 v14 M172 225 h16 M236 218 v14 M228 225 h16"/></g>
  <!-- 🚨 EL 千鳥破風, el fronton TRIANGULAR, que es el otro tipo. Que haya de las
       dos clases en la misma fachada es lo que hace que se lea «castillo» y no
       «torre de varios pisos». -->
  <path class="ma-hafu" d="M142 234 L180 196 L218 234 Z"/>
  <path class="ma-hafu-ojo" d="M180 210 L196 228 L164 228 Z"/>
  <path class="ma-tejado" d="M74 214 Q90 196 180 190 Q270 196 286 214 L294 224 L66 224 Z"/>
  <g class="ma-mensula"><rect x="104" y="208" width="7" height="13"/><rect x="176" y="204" width="8" height="17"/><rect x="249" y="208" width="7" height="13"/></g>

  <!-- ══════════ CUERPO 2 ══════════ -->
  <rect class="ma-blanco" x="108" y="160" width="144" height="18"/>
  <rect class="ma-negro" x="108" y="178" width="144" height="22"/>
  <g class="ma-tabla"><path d="M108 186 H252 M108 194 H252"/></g>
  <g class="ma-vano"><rect x="132" y="164" width="15" height="13"/><rect x="172" y="164" width="15" height="13"/><rect x="212" y="164" width="15" height="13"/></g>
  <g class="ma-reja"><path d="M139 164 v13 M132 170 h15 M179 164 v13 M172 170 h15 M219 164 v13 M212 170 h15"/></g>
  <path class="ma-tejado" d="M92 160 Q108 144 180 138 Q252 144 268 160 L276 170 L84 170 Z"/>
  <g class="ma-mensula"><rect x="120" y="154" width="7" height="12"/><rect x="176" y="150" width="8" height="16"/><rect x="233" y="154" width="7" height="12"/></g>

  <!-- ══════════ CUERPO 1 · el 望楼 de arriba, con su barandilla ══════════ -->
  <rect class="ma-blanco" x="126" y="98" width="108" height="34"/>
  <g class="ma-vano"><rect x="140" y="104" width="18" height="20"/><rect x="171" y="104" width="18" height="20"/><rect x="202" y="104" width="18" height="20"/></g>
  <g class="ma-reja"><path d="M149 104 v20 M140 114 h18 M180 104 v20 M171 114 h18 M211 104 v20 M202 114 h18"/></g>
  <!-- La galeria de la ultima planta -->
  <rect class="ma-negro" x="118" y="132" width="124" height="8"/>
  <g class="ma-baranda"><path d="M124 140 v10 M150 140 v10 M180 140 v10 M210 140 v10 M236 140 v10"/></g>
  <rect class="ma-negro" x="114" y="148" width="132" height="6"/>
  <!-- El tejado de la cumbre, a dos aguas -->
  <path class="ma-tejado" d="M110 98 Q126 72 180 64 Q234 72 250 98 L258 108 L102 108 Z"/>
  <!-- El caballete -->
  <rect class="ma-caballete" x="150" y="58" width="60" height="9" rx="4"/>

  <!-- 🚨 LOS DOS 鯱, los peces-dragon del caballete. Son lo mas pequeño del
       dibujo y lo primero que se busca al mirar un castillo japones. -->
  <path class="ma-shachi" d="M152 58 q-4 -14 4 -20 q6 -4 8 2 q-8 2 -6 8 q2 6 -6 10 z"/>
  <path class="ma-shachi" d="M208 58 q4 -14 -4 -20 q-6 -4 -8 2 q8 2 6 8 q-2 6 6 10 z"/>
</svg>
