<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 274" class="a-banda a-bosque-nevado" preserveAspectRatio="xMidYMax meet" aria-hidden="true" focusable="false">
  <!-- El mismo bosque de bosque.svg, nevado. MISMAS COORDENADAS Y LOS MISMOS
       NÚMEROS DE RANURA, otro color. Kiko pidió «los mismos árboles, pero
       nevados»: si un árbol se mueve en bosque.svg, se mueve aquí, y si cambia
       un número, cambia aquí. Son un archivo partido en dos.

       🚨 La nieve sobre papel blanco no se ve: no es blanca, es azul frío con
       trazo. Es el problema que tiene toda esta web —«blanca, muy clara, muy
       impoluta»— cuando lo que hay que dibujar es nieve. Se resuelve con el
       tinte frío del acto 4, no pintando el fondo. -->

  <!-- el suelo, ya cubierto. Va el primero: todo lo demás se apoya encima -->
  <path class="b-manto" d="M0 272 q40 -14 84 -8 q52 7 96 -4 q56 -14 112 -2 q48 10 92 -6 q54 -19 108 -4 q52 14 108 4 V274 H0 Z"/>

  <g class="slot" style="--i:0">
