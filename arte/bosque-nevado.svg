    <rect x="178" y="226" width="9"  height="46"/>
    <rect x="262" y="206" width="12" height="66"/>
    <rect x="360" y="230" width="9"  height="42"/>
    <rect x="452" y="212" width="11" height="60"/>
    <rect x="540" y="228" width="9"  height="44"/>
  </g>
