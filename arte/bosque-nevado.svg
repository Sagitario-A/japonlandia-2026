<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 274" class="a-banda a-bosque-nevado" preserveAspectRatio="xMidYMax meet" aria-hidden="true" focusable="false">
  <!-- El mismo bosque de bosque.svg, nevado. MISMAS COORDENADAS, otro color.
       🚨 La nieve sobre papel blanco no se ve: no es blanca, es azul frío con
       trazo. Es el problema que tiene toda esta web —«blanca, muy clara, muy
       impoluta»— cuando lo que hay que dibujar es nieve. Se resuelve con el
       tinte frío del acto 4, no pintando el fondo. -->
