<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" class="a-poza-fondo" aria-hidden="true" focusable="false">
  <!-- EL CHARCO DE LA CIMA · la mitad de ATRAS. Acto 6.

       🔁 ESTO ERA UN ONSEN CON BORDE DE PIEDRAS Y AHORA ES UN CHARCO, y lo
       cambio Kiko en la segunda ronda: «quita el resto del onsen antiguo ese,
       que no tiene nada que ver. Que la base sea el charco, no ese que existe».
       Tenia razon: con su borde de rocas era una version pequeña del onsen del
       muñeco, y entonces habia DOS onsen iguales en la misma pantalla y ninguno
       de los dos contaba nada. Un charco de agua en el llano de la cima si: es
       lo que hay de verdad donde se bañan estos monos.

       🚨 ASI QUE AQUI NO HAY BORDE: solo agua. La cima llana de
       arte/monte-mono.svg hace de orilla, y por eso el charco se coloca con su
       altura sacada del perfil de la montaña — es literalmente la base de la
       cima.

       🚨 VA PARTIDO EN DOS, igual que el onsen del acto 5 y por el mismo motivo:
       para que se vea al mono DENTRO del agua. Esta mitad va DETRAS de el;
       arte/poza.svg va delante. Las dos comparten `viewBox`, caja y posicion, y
       SI SE TOCA UNA SE TOCA LA OTRA. Se parten por el eje del agua, y=104, el
       mismo que la del acto 5: asi la cuenta de cuanto se hunde el que se meta
       dentro es la misma para las dos.

       📄 En los comentarios de un `.svg` las variables de CSS se nombran
       entrecomilladas y sin sus dos guiones: dos guiones seguidos son XML
       invalido y estos archivos se abren en un editor vectorial. -->

  <!-- El agua, mitad de atras: la elipse recortada por su eje. Y nada mas. -->
  <path class="o-agua" d="M42 104 A108 34 0 0 1 258 104 Z"/>
</svg>
