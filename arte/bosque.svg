<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 274" class="a-banda a-bosque" preserveAspectRatio="xMidYMax meet" aria-hidden="true" focusable="false">
  <!-- El bosque. 🚨 MISMA GEOMETRÍA EXACTA que bosque-nevado.svg: Kiko pidió
       «los mismos árboles, pero nevados», así que si un árbol se mueve aquí, se
       mueve allí. Cambiar uno sin el otro hace que el bosque salte en el
       fundido. Los bordes casan igual que en la ciudad.

       🚨 CADA ÁRBOL ES UNA RANURA CON SU NÚMERO, el mismo sistema que la
       ciudad y al revés: la casa con el número 3 se va justo cuando el árbol
       con el número 3 llega. Así la transición es «casa, árbol, casa, árbol,
       cada vez menos casa y más árbol», que es lo que pidió, y no un fundido de
       una imagen a otra.
       🚨 Los números de aquí tienen que existir en ciudad.svg. Se tocan los dos
       archivos a la vez o no se toca ninguno. -->

  <g class="slot" style="--i:0">
    <rect class="b-tronco" x="72" y="214" width="11" height="58"/>
    <path class="b-copa" d="M77.5 96  L112 168 H43 Z"/>
    <path class="b-copa" d="M77.5 134 L120 218 H35 Z"/>
  </g>

