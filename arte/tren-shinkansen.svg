<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 1500" preserveAspectRatio="none" class="a-tren7" aria-hidden="true" focusable="false">
  <!-- EL SHINKANSEN TŌKAIDŌ (東海道新幹線), VISTO DESDE ARRIBA · acto 7.
       Nagoya → Kioto, ~35 min ✅ — investigacion/021 § 3.

       🚨 EL MORRO VA ABAJO, igual que el del Shinano y por lo mismo: el viaje
       baja por la pantalla porque baja por el mapa —Matsumoto al norte, Kioto
       al sur—. Lo corrigió Kiko el 20 de septiembre: «tendría que continuar
       para abajo, porque al final es un viaje unidireccional en una dirección».

       🚨 ES EL MISMO CUERPO QUE tren-shinano.svg Y SOLO CAMBIA EL MORRO.
       Kiko, el 18 de septiembre: *mismo tamaño, morro distinto*. Las dos barras
       miden lo mismo, las bandas del costado son las mismas y las divisiones de
       coche caen en 196, 426, 656, 886 y 1116 en los dos, para que en el
       transbordo las dos se lean como un espejo. Lo único que cambia es la
       punta — que es, además, lo único que de verdad distingue a estos dos
       trenes cuando se miran desde arriba.

       🚨 LA GEOMETRÍA DEL CUERPO ESTÁ ESCRITA DOS VECES, aquí y en el Shinano.
       Mismo caso que bosque.svg y bosque-nevado.svg: **no se toca uno sin tocar
       el otro**.

       ⚠️ LOS COLORES NO SON LA LIBREA DE VERDAD, igual que en el Shinano: los
       colores de línea de este viaje están sin verificar (PENDIENTE W4) y en
       esta web el color de una línea es un dato. Misma paleta de tren que el
       cercanías del acto 3.

       📐 Proporción: 120 × 1500, pieza de 24u × 300u, los dos ejes a la misma
       escala. -->

  <!-- 🚨 EL MORRO, Y AQUÍ ESTÁ TODA LA DIFERENCIA: LARGO Y AFILADO.
       El morro de un N700 mide casi la mitad de un coche entero, y desde arriba
       es una parábola que se estrecha muchísimo antes de llegar a la punta.
       El del Shinano se planta en y=1448; este llega hasta y=1475 y empieza a
       estrecharse ya en y=1080, o sea más de un coche antes. Puesto al lado del
       otro, se reconoce sin que nadie lo explique. -->
  <path class="v7-cuerpo" d="M6 0 V1080 C6 1250 22 1410 60 1475 C98 1410 114 1250 114 1080 V0 Z"/>

  <!-- El parabrisas, muy por detrás de la punta: en un shinkansen la cabina va
       detrás de todo ese morro, y eso también se ve desde arriba. -->
  <path class="v7-cristal" d="M26 1105 C30 1200 42 1250 60 1250 C78 1250 90 1200 94 1105 Z"/>

  <!-- Las dos bandas del costado, IGUALES que las del Shinano, y acaban donde
       el cuerpo empieza a estrecharse -->
  <rect class="v7-banda" x="6" y="0" width="9" height="1080"/>
  <rect class="v7-banda" x="105" y="0" width="9" height="1080"/>

  <!-- El lomo del techo, del final a la punta -->
  <rect class="v7-lomo" x="58" y="0" width="4" height="1380"/>

  <!-- Las divisiones entre coches. 🚨 EN LOS MISMOS SITIOS QUE EL SHINANO -->
  <g class="v7-junta">
    <rect x="6" y="196" width="108" height="8"/>
    <rect x="6" y="426" width="108" height="8"/>
    <rect x="6" y="656" width="108" height="8"/>
    <rect x="6" y="886" width="108" height="8"/>
    <rect x="6" y="1116" width="108" height="8"/>
  </g>

  <!-- Los equipos del techo. El coche de cabeza va limpio: ahí está el morro -->
  <g class="v7-equipo">
    <rect x="34" y="86" width="52" height="34" rx="6"/>
    <rect x="34" y="246" width="52" height="34" rx="6"/>
    <rect x="34" y="316" width="52" height="34" rx="6"/>
    <rect x="34" y="476" width="52" height="34" rx="6"/>
    <rect x="34" y="546" width="52" height="34" rx="6"/>
    <rect x="34" y="706" width="52" height="34" rx="6"/>
    <rect x="34" y="776" width="52" height="34" rx="6"/>
    <rect x="34" y="936" width="52" height="34" rx="6"/>
    <rect x="34" y="1006" width="52" height="34" rx="6"/>
  </g>

  <!-- 🚨 LOS PANTÓGRAFOS, la firma de un tren eléctrico visto desde arriba: el
       marco carenado y, cruzada, la pletina que roza el cable. -->
  <g class="v7-panto">
    <rect x="38" y="798" width="44" height="30" rx="3"/>
    <rect class="v7-pletina" x="32" y="814" width="56" height="6"/>
    <rect x="38" y="338" width="44" height="30" rx="3"/>
    <rect class="v7-pletina" x="32" y="354" width="56" height="6"/>
  </g>

  <!-- Las puertas. Un shinkansen tiene menos por coche que un cercanías: dos -->
  <g class="v7-puerta">
    <rect x="6" y="900" width="9" height="40"/><rect x="105" y="900" width="9" height="40"/>
    <rect x="6" y="820" width="9" height="40"/><rect x="105" y="820" width="9" height="40"/>
    <rect x="6" y="670" width="9" height="40"/><rect x="105" y="670" width="9" height="40"/>
    <rect x="6" y="590" width="9" height="40"/><rect x="105" y="590" width="9" height="40"/>
    <rect x="6" y="440" width="9" height="40"/><rect x="105" y="440" width="9" height="40"/>
    <rect x="6" y="360" width="9" height="40"/><rect x="105" y="360" width="9" height="40"/>
    <rect x="6" y="210" width="9" height="40"/><rect x="105" y="210" width="9" height="40"/>
    <rect x="6" y="130" width="9" height="40"/><rect x="105" y="130" width="9" height="40"/>
  </g>
</svg>
