<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 274" class="a-banda a-ciudad" preserveAspectRatio="xMidYMax meet" aria-hidden="true" focusable="false">
  <!-- Una banda de ciudad que se repite. El coche no se mueve: se mueve esto.
       🚨 SE REPITE EN BUCLE, así que los dos bordes tienen que casar: no hay
       ningún edificio pegado a x=0 ni a x=600, y el suelo llega de lado a lado.
       Si un edificio tocara el borde, al repetir saldría partido por la mitad.

       🚨 CADA EDIFICIO ES UNA «RANURA» CON SU NÚMERO (––i), y ese número es lo
       que hace que la ciudad se convierta en bosque casa a casa en vez de con
       un fundido. Lo pidió Kiko el 17 de septiembre: «debería ser una
       transición más de dejar de casa árbol, casa árbol, cada vez menos casa
       más árbol, hasta que solo es árbol».

       🚨 Y LOS NÚMEROS NO VAN DE IZQUIERDA A DERECHA a propósito: si fueran
       ordenados, las casas desaparecerían en fila como una persiana que se
       cierra. Repartidos, unas se van antes que otras y parece que el bosque
       gana terreno. El árbol que ocupa su sitio está en bosque.svg con el mismo
       número, así que los dos archivos se tocan a la vez o no se tocan. -->

  <g class="slot" style="--i:3">
    <rect class="b-lejos" x="30" y="152" width="52" height="118" rx="3"/>
  </g>

  <g class="slot" style="--i:0">
    <rect class="b-cerca" x="86" y="104" width="56" height="166" rx="3"/>
    <rect class="b-ventana" x="96" y="120" width="10" height="13"/>
    <rect class="b-ventana" x="114" y="120" width="10" height="13"/>
    <rect class="b-ventana" x="96" y="146" width="10" height="13"/>
    <rect class="b-ventana" x="114" y="146" width="10" height="13"/>
    <rect class="b-ventana" x="96" y="172" width="10" height="13"/>
    <rect class="b-ventana" x="114" y="172" width="10" height="13"/>
  </g>

  <g class="slot" style="--i:7">
    <rect class="b-lejos" x="146" y="176" width="44" height="94" rx="3"/>
  </g>

  <g class="slot" style="--i:2">
