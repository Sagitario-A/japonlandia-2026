<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 274" class="a-banda a-ciudad" preserveAspectRatio="xMidYMax meet" aria-hidden="true" focusable="false">
  <!-- Una banda de ciudad que se repite. El coche no se mueve: se mueve esto.
       🚨 SE REPITE EN BUCLE, así que los dos bordes tienen que casar: no hay
       ningún edificio pegado a x=0 ni a x=600, y el suelo llega de lado a lado.
       Si un edificio tocara el borde, al repetir saldría partido por la mitad. -->
  <g class="b-lejos">
    <rect x="30"  y="152" width="52" height="118" rx="3"/>
    <rect x="146" y="176" width="44" height="94"  rx="3"/>
    <rect x="286" y="140" width="58" height="130" rx="3"/>
    <rect x="428" y="168" width="48" height="102" rx="3"/>
  </g>
  <g class="b-cerca">
    <rect x="86"  y="104" width="56" height="166" rx="3"/>
    <rect x="194" y="128" width="68" height="142" rx="3"/>
    <rect x="266" y="186" width="16" height="84"/>
    <rect x="348" y="92"  width="52" height="178" rx="3"/>
    <rect x="404" y="164" width="20" height="106"/>
    <rect x="480" y="120" width="62" height="150" rx="3"/>
    <rect x="546" y="196" width="34" height="74" rx="3"/>
  </g>
  <g class="b-ventana">
    <rect x="96"  y="120" width="10" height="13"/><rect x="114" y="120" width="10" height="13"/>
    <rect x="96"  y="146" width="10" height="13"/><rect x="114" y="146" width="10" height="13"/>
    <rect x="96"  y="172" width="10" height="13"/><rect x="114" y="172" width="10" height="13"/>
    <rect x="206" y="146" width="12" height="14"/><rect x="230" y="146" width="12" height="14"/>
    <rect x="206" y="176" width="12" height="14"/><rect x="230" y="176" width="12" height="14"/>
    <rect x="358" y="110" width="11" height="14"/><rect x="378" y="110" width="11" height="14"/>
    <rect x="358" y="140" width="11" height="14"/><rect x="378" y="140" width="11" height="14"/>
    <rect x="358" y="170" width="11" height="14"/><rect x="378" y="170" width="11" height="14"/>
    <rect x="492" y="138" width="12" height="14"/><rect x="518" y="138" width="12" height="14"/>
    <rect x="492" y="168" width="12" height="14"/><rect x="518" y="168" width="12" height="14"/>
  </g>
  <rect class="b-suelo" x="0" y="270" width="600" height="3"/>
